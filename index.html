<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursed Arcana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&family=Crimson+Text:ital@0;1&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Crimson Text',serif;
  background:#0a0a0f;color:#e0d6c8;
  overflow:hidden;height:100vh;width:100vw;
  user-select:none
}

.bg{
  position:fixed;inset:0;z-index:0;
  background:url(assets/bg_battle.png) center/cover no-repeat;
  filter:brightness(0.35) saturate(1.5)
}
.bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,0.8) 0%,transparent 40%,transparent 60%,rgba(0,0,0,0.6) 100%)
}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,0.85)}
.pc{position:fixed;inset:0;z-index:1;pointer-events:none}

.title{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:6px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,0.9),transparent);
  pointer-events:none;
  display:flex;justify-content:space-between;align-items:center
}
.title h1{
  font-family:'Uncial Antiqua',serif;
  font-size:12px;letter-spacing:4px;
  background:linear-gradient(135deg,#cc1111,#6a0dad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.title .turno{font-size:10px;color:rgba(224,214,200,0.2);letter-spacing:2px}

/* ═══ BATTLE ═══ */
.scene{
  position:fixed;inset:0;top:30px;z-index:2;
  display:flex;flex-direction:column
}

/* TOP HALF: characters */
.arena{
  flex:1;
  display:flex;
  padding:0 6px;
  min-height:0
}

/* MAGE (LEFT) */
.mage-side{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:flex-start
}
.mage-fig{
  width:400px;height:400px;
  display:flex;align-items:center;justify-content:center;
  position:relative
}
.mage-fig .sprite{
  width:240px;height:320px;
  background:url(assets/mage_sheet.png) 0 0 / 960px 320px no-repeat;
  image-rendering:pixelated;
  filter:drop-shadow(0 0 40px rgba(106,13,173,0.2));
  animation:mageIdle 3.2s steps(4) infinite
}
@keyframes mageIdle{
  from{background-position:0 0}
  to{background-position:-720px 0}
}
.mage-fig.casting .sprite{
  animation:mageCast 0.35s steps(4) !important
}
@keyframes mageCast{
  from{background-position:0 0}
  to{background-position:-720px 0}
}

.mage-hp{
  position:absolute;top:20px;left:20px;
  width:140px
}
.mage-hp .row{
  display:flex;justify-content:space-between;
  font-family:'MedievalSharp',serif;
  font-size:9px;letter-spacing:1px;margin-bottom:1px
}
.mage-hp .row .l{color:rgba(224,214,200,0.4)}
.mage-hp .row .r{color:#00b8a0}
.mage-hp .bar{
  height:3px;background:rgba(255,255,255,0.03);border-radius:2px;overflow:hidden
}
.mage-hp .fill{
  height:100%;
  background:linear-gradient(90deg,#007a6a,#00b8a0);
  transition:width 0.4s;border-radius:2px
}

/* ENEMY (RIGHT) */
.enemy-side{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:flex-end
}
.enemy-fig{
  width:400px;height:400px;
  display:flex;align-items:center;justify-content:center;
  position:relative
}
.enemy-fig::before{
  content:'';position:absolute;
  width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(106,13,173,0.1),rgba(204,17,17,0.04),transparent 70%);
  animation:enemyAura 3s ease-in-out infinite
}
@keyframes enemyAura{
  0%,100%{transform:scale(1);opacity:0.4}
  50%{transform:scale(1.1);opacity:0.8}
}
.enemy-fig::after{
  content:'';position:absolute;
  width:350px;height:350px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(106,13,173,0.03),transparent,rgba(204,17,17,0.03),transparent);
  animation:enemySpin 12s linear infinite
}
@keyframes enemySpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.enemy-fig .sprite{
  position:relative;z-index:2;
  width:240px;height:340px;
  background:url(assets/lich_sheet.png) 0 0 / 960px 340px no-repeat;
  image-rendering:pixelated;
  filter:drop-shadow(0 0 50px rgba(139,0,0,0.25));
  animation:enemyIdle 2.8s steps(4) infinite
}
@keyframes enemyIdle{
  from{background-position:0 0}
  to{background-position:-720px 0}
}
.enemy-fig.attacking .sprite{
  animation:enemyAttack 0.4s steps(4) !important
}
@keyframes enemyAttack{
  from{background-position:0 0}
  to{background-position:-720px 0}
}
.enemy-fig.hurt .sprite{
  animation:enemyHurt 0.3s steps(4) !important;
  filter:brightness(2.5) drop-shadow(0 0 30px rgba(255,0,0,0.5)) !important
}
@keyframes enemyHurt{
  from{background-position:0 0}
  to{background-position:-720px 0}
}

.enemy-hp{
  position:absolute;top:20px;right:20px;
  width:140px
}
.enemy-hp .row{
  display:flex;justify-content:space-between;
  font-family:'MedievalSharp',serif;
  font-size:9px;letter-spacing:1px;margin-bottom:1px
}
.enemy-hp .row .l{color:rgba(224,214,200,0.4);text-transform:uppercase}
.enemy-hp .row .r{color:#cc1111}
.enemy-hp .bar{
  height:3px;background:rgba(255,255,255,0.03);border-radius:2px;overflow:hidden
}
.enemy-hp .fill{
  height:100%;
  background:linear-gradient(90deg,#4a0072,#cc1111);
  transition:width 0.4s;border-radius:2px;
  box-shadow:0 0 6px rgba(204,17,17,0.3)
}
.enemy-intent{
  position:absolute;
  bottom:10px;
  font-family:'MedievalSharp',serif;
  font-size:9px;letter-spacing:2px;
  color:rgba(204,17,17,0.5);text-transform:uppercase
}

/* STATS BAR */
.stats{
  flex-shrink:0;
  display:flex;justify-content:center;gap:6px;
  padding:3px 10px;
  background:rgba(0,0,0,0.3)
}
.stat{
  display:flex;align-items:center;gap:3px;
  padding:2px 8px;
  border:1px solid rgba(255,255,255,0.04);
  font-size:11px
}
.stat .v{
  font-family:'MedievalSharp',serif;
  font-weight:700;font-size:13px;min-width:14px;text-align:center
}
.stat .v.hp{color:#cc1111}
.stat .v.block{color:#00b8a0}
.stat .v.energy{color:#6a0dad}
.stat .s{color:rgba(224,214,200,0.15);font-size:9px}
.pile{font-size:9px;color:rgba(224,214,200,0.2);display:flex;align-items:center;gap:6px}
.pile span{color:#c9a84c}

/* ═══ CARDS ═══ */
.hand{
  flex-shrink:0;
  display:flex;justify-content:center;align-items:flex-end;
  padding:0 6px 4px;
  min-height:120px;perspective:600px
}
.card{
  width:100px;height:140px;flex-shrink:0;
  margin:0 -16px;position:relative;
  cursor:pointer;
  transform-origin:bottom center;
  transition:transform 0.2s,margin 0.2s,filter 0.2s;
  border:1px solid rgba(106,13,173,0.12);
  background:rgba(10,10,15,0.6);
  overflow:hidden
}
.card:nth-child(1){transform:rotate(-10deg) translateY(4px)}
.card:nth-child(2){transform:rotate(-5deg) translateY(1px)}
.card:nth-child(3){transform:rotate(0deg) translateY(0)}
.card:nth-child(4){transform:rotate(5deg) translateY(1px)}
.card:nth-child(5){transform:rotate(10deg) translateY(4px)}
.card:nth-child(6){transform:rotate(14deg) translateY(8px)}
.card:nth-child(7){transform:rotate(-14deg) translateY(8px)}

.card.playable:hover{
  transform:rotate(0deg) translateY(-30px) scale(1.2) !important;
  z-index:50 !important;margin:0 -6px;
  border-color:rgba(106,13,173,0.5);
  box-shadow:0 0 25px rgba(106,13,173,0.12),0 10px 30px rgba(0,0,0,0.4)
}
.card.disabled{filter:brightness(0.3) grayscale(0.7);cursor:not-allowed}
.card.disabled:hover{transform:none !important;margin:0 -16px}

.card-s{position:absolute;top:0;left:0;right:0;height:2px;z-index:5}
.card-s.attack{background:linear-gradient(90deg,#8b0000,#cc1111)}
.card-s.skill{background:linear-gradient(90deg,#005a4a,#00b8a0)}
.card-s.power{background:linear-gradient(90deg,#3a0050,#6a0dad)}

.card-art{position:absolute;inset:0}
.card-art img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}

.card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:55%;
  background:linear-gradient(0deg,rgba(10,10,15,0.95) 0%,transparent 60%);
  pointer-events:none;z-index:2
}

.card-c{
  position:absolute;top:3px;left:3px;
  width:18px;height:18px;z-index:6;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#7b2d8e,#3a0050);
  border:1px solid rgba(106,13,173,0.4);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#fff
}

.card-n{
  position:absolute;bottom:16px;left:4px;right:4px;z-index:5;
  font-family:'MedievalSharp',serif;
  font-size:8px;letter-spacing:0.5px;text-align:center;
  color:#e0d6c8;text-shadow:0 2px 6px rgba(0,0,0,0.9);line-height:1.1
}
.card-d{
  position:absolute;bottom:2px;left:4px;right:4px;z-index:5;
  font-family:'Crimson Text',serif;font-style:italic;
  font-size:7px;text-align:center;
  color:rgba(224,214,200,0.4);text-shadow:0 2px 4px rgba(0,0,0,0.9)
}

/* FLYING CARD */
.fc{
  position:fixed;z-index:200;pointer-events:none;
  width:60px;height:80px
}
.fc .bolt{
  width:60px;height:80px;
  background:url(assets/bolt_sheet.png) 0 0 / 240px 80px no-repeat;
  image-rendering:pixelated;
  animation:boltAnim 0.3s steps(4) infinite
}
@keyframes boltAnim{
  from{background-position:0 0}
  to{background-position:-180px 0}
}

/* FLOATING TEXT */
.ft{
  position:fixed;z-index:50;pointer-events:none;
  font-family:'MedievalSharp',serif;
  font-weight:900;font-size:34px;
  text-shadow:0 0 30px rgba(0,0,0,0.9),0 6px 15px rgba(0,0,0,0.5);
  animation:fu 1s ease forwards
}
.ft.dmg{color:#ff3333}
.ft.block{color:#00ffd0}
.ft.heal{color:#00e6c8}
.ft.buff{color:#aa44ff}
@keyframes fu{
  0%{opacity:1;transform:translateY(0) scale(0.5)}
  20%{opacity:1;transform:translateY(-10px) scale(1.3)}
  100%{opacity:0;transform:translateY(-70px) scale(0.8)}
}

/* BUTTONS */
.eb{
  position:fixed;bottom:6px;right:10px;z-index:10;
  padding:5px 14px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(204,17,17,0.12);
  color:rgba(204,17,17,0.35);
  font-family:'MedievalSharp',serif;
  font-size:8px;letter-spacing:2px;
  cursor:pointer;transition:all 0.3s
}
.eb:hover{background:rgba(139,0,0,0.08);border-color:rgba(204,17,17,0.3);color:#cc1111}

.log{
  position:fixed;bottom:30px;left:10px;z-index:10;pointer-events:none
}
.log p{
  font-style:italic;font-size:9px;
  color:rgba(224,214,200,0.2);
  opacity:0;animation:lf 2.5s ease forwards;
  margin-bottom:1px
}
.log p.d{color:#cc1111}
.log p.b{color:#00b8a0}
.log p.e{color:#ff6b35}
@keyframes lf{
  0%{opacity:0;transform:translateY(3px)}
  15%{opacity:1}
  80%{opacity:1}
  100%{opacity:0;transform:translateY(-3px)}
}

.result{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(0,0,0,0.88)
}
.result.show{display:flex}
.result h2{
  font-family:'Uncial Antiqua',serif;
  font-size:36px;letter-spacing:8px;margin-bottom:6px
}
.result h2.v{background:linear-gradient(135deg,#c9a84c,#00b8a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result h2.d{background:linear-gradient(135deg,#8b0000,#cc1111);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result p{font-size:12px;color:rgba(224,214,200,0.3);margin-bottom:16px;font-style:italic}
.result button{
  padding:6px 24px;background:transparent;
  border:1px solid #c9a84c;color:#c9a84c;
  font-family:'MedievalSharp',serif;
  font-size:11px;letter-spacing:3px;
  cursor:pointer;transition:all 0.3s
}
.result button:hover{background:rgba(201,168,76,0.1)}

.sh{animation:sh 0.35s ease}
@keyframes sh{
  0%,100%{transform:translate(0)}
  15%{transform:translate(-4px,2px)}
  30%{transform:translate(3px,-3px)}
  45%{transform:translate(-2px,1px)}
  60%{transform:translate(2px,-2px)}
}

@media(max-width:600px){
  .mage-fig{width:200px;height:200px}
  .mage-fig .sprite{width:120px;height:160px;background-size:480px 160px}
  .enemy-fig{width:220px;height:220px}
  .enemy-fig .sprite{width:120px;height:180px;background-size:480px 180px}
  .enemy-fig::before{width:250px;height:250px}
  .enemy-fig::after{width:280px;height:280px}
  .mage-hp,.enemy-hp{width:100px}
  .card{width:80px;height:112px;margin:0 -14px}
  .card-n{font-size:7px;bottom:13px}
  .card-d{font-size:6px}
  .card-c{width:15px;height:15px;font-size:8px}
  .hand{min-height:100px}
  .ft{font-size:24px}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="vig"></div>
<canvas class="pc" id="pc"></canvas>

<div class="title">
  <h1>Cursed Arcana</h1>
  <span class="turno" id="turnoInd">TU TURNO</span>
</div>

<div class="scene" id="scene">

  <div class="arena">

    <!-- MAGE LEFT -->
    <div class="mage-side">
      <div class="mage-fig" id="mFig">
        <div class="mage-hp">
          <div class="row"><span class="l">✧ Mago Oscuro</span><span class="r" id="mHpT">30/30</span></div>
          <div class="bar"><div class="fill" id="mHpF" style="width:100%"></div></div>
        </div>
        <div class="sprite" id="mImg"></div>
      </div>
    </div>

    <!-- ENEMY RIGHT -->
    <div class="enemy-side">
      <div class="enemy-fig" id="eFig">
        <div class="enemy-hp">
          <div class="row"><span class="l" id="eNameT">✧ Lich Rey</span><span class="r" id="eHpT">18/18</span></div>
          <div class="bar"><div class="fill" id="eHpF" style="width:100%"></div></div>
        </div>
        <div class="sprite" id="eImg"></div>
        <div class="enemy-intent" id="eIntent">⚔️ ATACAR · 6</div>
      </div>
    </div>

  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><span class="v hp" id="pHp">30</span><span class="s">/30</span></div>
    <div class="stat"><span class="v block" id="pBlo">0</span></div>
    <div class="stat"><span class="v energy" id="pEn">3</span><span class="s">/3</span></div>
    <div class="pile"><span id="pDraw">9</span> · <span id="pDisc">0</span></div>
  </div>

  <!-- HAND -->
  <div class="hand" id="hand"></div>
</div>

<button class="eb" id="eb">FINALIZAR</button>
<div class="log" id="log"></div>

<div class="result" id="res">
  <h2 id="rT">VICTORIA</h2>
  <p id="rD">El poder del relicario es tuyo.</p>
  <button id="rB">VOLVER A EMPEZAR</button>
</div>

<script>
/* ════════════════════════════════════════════════════════
   CURSED ARCANA — v0.5 FINAL
   ════════════════════════════════════════════════════════ */

// ─── PARTICLES ──────────────────────────────────────────
const c=document.getElementById('pc'),x=c.getContext('2d');
let cw,ch;
function rs(){cw=c.width=window.innerWidth;ch=c.height=window.innerHeight}
window.addEventListener('resize',rs);rs();
let ps=[];for(let i=0;i<15;i++)ps.push({x:Math.random()*cw,y:Math.random()*ch,vx:(Math.random()-0.5)*0.1,vy:-Math.random()*0.06-0.01,s:Math.random()*1+0.2,o:Math.random()*0.1+0.01,p:Math.random()*6});
function pa(){
  x.clearRect(0,0,cw,ch);
  ps.forEach(p=>{p.x+=p.vx+Math.sin(p.p+Date.now()*0.0003)*0.02;p.y+=p.vy;if(p.y<-5){p.y=ch+5;p.x=Math.random()*cw}x.beginPath();x.arc(p.x,p.y,p.s,0,6);x.fillStyle=`rgba(106,13,173,${p.o})`;x.fill()});
  requestAnimationFrame(pa)
}
pa();

// ─── GAME ENGINE ────────────────────────────────────────

const CARDS=[
  {id:'golpe',name:'Golpe Arcano',t:'attack',c:1,art:'assets/card_strike.png',d:'6 de daño.',
   fx:(e,j)=>{const d=6+(j.s||0);e.hp-=d;if(e.hp<0)e.hp=0;return{t:'dmg',v:d}}},
  {id:'escudo',name:'Escudo Espectral',t:'skill',c:1,art:'assets/card_shield.png',d:'+5 Bloqueo.',
   fx:(e,j)=>{j.blo+=5;return{t:'blo',v:5}}},
  {id:'drenar',name:'Drenar Vida',t:'attack',c:2,art:'assets/card_drain.png',d:'4 daño. +3 PV.',
   fx:(e,j)=>{e.hp-=4;if(e.hp<0)e.hp=0;j.pv=Math.min(j.pvM,j.pv+3);return{t:'dmg',v:4}}},
  {id:'abismo',name:'Abismo Oscuro',t:'power',c:2,art:'assets/card_abyss.png',d:'+2 Fuerza.',
   fx:(e,j)=>{j.s=(j.s||0)+2;return{t:'buf',v:2}}}
];

class Crd{constructor(t){Object.assign(this,t)}canP(j){return j.en>=this.c}}

function newEnemy(){return{hp:18,hpM:18,dmg:6,blo:0}}
function newPlayer(){
  return{
    pv:30,pvM:30,blo:0,en:3,enM:3,s:0,
    mazo:[],mano:[],desc:[]
  }
}

function initDeck(p){
  p.mazo=[];
  for(let i=0;i<3;i++)p.mazo.push(new Crd(CARDS[0]));
  for(let i=0;i<3;i++)p.mazo.push(new Crd(CARDS[1]));
  for(let i=0;i<2;i++)p.mazo.push(new Crd(CARDS[2]));
  p.mazo.push(new Crd(CARDS[3]));
  shuffle(p.mazo);
  p.desc=[];p.mano=[];p.blo=0;p.s=0;p.en=p.enM
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}

function draw(p,n){
  let r=0;
  for(let i=0;i<n;i++){
    if(p.mazo.length===0){
      if(p.desc.length===0)break;
      p.mazo=p.desc;p.desc=[];shuffle(p.mazo);
      L('Mazo rebarajado...')
    }
    p.mano.push(p.mazo.pop());r++
  }
  return r
}

function playCard(p,e,idx){
  const c=p.mano[idx];
  if(!c||!c.canP(p)||state!=='player')return null;
  p.en-=c.c;
  p.mano.splice(idx,1);
  p.desc.push(c);
  return{c,res:c.fx(e,p)}
}

function endPlayerTurn(p){
  while(p.mano.length)p.desc.push(p.mano.pop());
  p.blo=0;p.en=p.enM
}

function startPlayerTurn(p){
  p.blo=0;p.en=p.enM;draw(p,5)
}

// ─── STATE ──────────────────────────────────────────────
let P,E,state='idle';

const $=id=>document.getElementById(id);
const mFig=$('mFig'),mImg=$('mImg'),mHpF=$('mHpF'),mHpT=$('mHpT');
const eFig=$('eFig'),eImg=$('eImg'),eHpF=$('eHpF'),eHpT=$('eHpT'),eNameT=$('eNameT'),eIntent=$('eIntent');
const pHp=$('pHp'),pBlo=$('pBlo'),pEn=$('pEn'),pDraw=$('pDraw'),pDisc=$('pDisc');
const handEl=$('hand'),logEl=$('log'),scene=$('scene'),turnoInd=$('turnoInd');
const res=$('res'),rT=$('rT'),rD=$('rD');

function L(txt,cls=''){
  const p=document.createElement('p');
  if(cls)p.className=cls;
  p.textContent=txt;logEl.appendChild(p);
  while(logEl.children.length>5)logEl.removeChild(logEl.firstChild)
}

function FT(x,y,text,cls){
  const el=document.createElement('div');el.className='ft '+cls;
  el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000)
}

function SH(){scene.classList.remove('sh');void scene.offsetWidth;scene.classList.add('sh')}

function CF(fx,fy,tx,ty,src,cb){
  const el=document.createElement('div');el.className='fc';
  el.innerHTML='<div class="bolt"></div>';
  el.style.left=fx+'px';el.style.top=fy+'px';
  document.body.appendChild(el);
  const dx=tx-fx,dy=ty-fy,start=performance.now();
  function tk(n){
    const t=Math.min((n-start)/300,1),e=1-Math.pow(1-t,3);
    el.style.left=(fx+dx*e)+'px';el.style.top=(fy+dy*e)+'px';
    el.style.transform=`rotate(${-15*e}deg) scale(${1-e*0.4})`;
    el.style.opacity=1-e*0.3;
    if(t<1)requestAnimationFrame(tk);else{el.remove();if(cb)cb()}
  }
  requestAnimationFrame(tk)
}

function render(){
  const ep=(E.hp/E.hpM)*100;eHpF.style.width=ep+'%';eHpT.textContent=`${E.hp}/${E.hpM}`;
  const pp=(P.pv/P.pvM)*100;mHpF.style.width=pp+'%';mHpT.textContent=`${P.pv}/${P.pvM}`;
  pHp.textContent=P.pv;pBlo.textContent=P.blo;pEn.textContent=P.en;
  pDraw.textContent=P.mazo.length;pDisc.textContent=P.desc.length;
  eIntent.textContent=`🗡️ ATACAR · ${E.dmg}`;
  turnoInd.textContent=state==='player'?'TU TURNO':'TURNO ENEMIGO';
  renderHand()
}

function renderHand(){
  handEl.innerHTML='';
  P.mano.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='card'+(c.canP(P)&&state==='player'?' playable':' disabled');
    el.innerHTML=`<div class="card-s ${c.t}"></div><div class="card-art"><img src="${c.art}" alt=""></div><div class="card-c">${c.c}</div><div class="card-n">${c.name}</div><div class="card-d">${c.d}</div>`;
    if(c.canP(P)&&state==='player'){
      // Click to play (primary)
      el.addEventListener('click',()=>onPlay(i));
      // Drag to play (secondary)
      el.addEventListener('mousedown',(e)=>{startDrag(e,i,el);});
    }
    handEl.appendChild(el)
  })
}

// ─── DRAG ───────────────────────────────────────────────
let dg=null,di=null,dc=null,de=null;

function startDrag(e,idx,el){
  if(state!=='player'||!P.mano[idx]||!P.mano[idx].canP(P))return;
  e.preventDefault();
  di=idx;dc=P.mano[idx];de=el;
  el.style.opacity='0.3';
  dg=document.createElement('div');
  dg.className='card playable';
  dg.style.cssText='position:fixed;z-index:100;pointer-events:none;width:100px;height:140px;transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);opacity:0.85';
  dg.innerHTML=`<div class="card-s ${dc.t}"></div><div class="card-art"><img src="${dc.art}" alt=""></div><div class="card-c">${dc.c}</div><div class="card-n">${dc.name}</div>`;
  dg.style.left=e.clientX+'px';dg.style.top=e.clientY+'px';
  document.body.appendChild(dg);
  document.addEventListener('mousemove',onDrag);
  document.addEventListener('mouseup',endDrag);
  document.addEventListener('touchmove',onTD,{passive:false});
  document.addEventListener('touchend',onTE)
}

function onDrag(e){
  if(!dg)return;
  dg.style.left=e.clientX+'px';dg.style.top=e.clientY+'px';
  const er=eFig.getBoundingClientRect();
  const isOver=e.clientX>er.left&&e.clientX<er.right&&e.clientY>er.top&&e.clientY<er.bottom;
  eFig.style.filter=isOver?'brightness(1.15) drop-shadow(0 0 20px rgba(204,17,17,0.2))':''
}
function onTD(e){e.preventDefault();const t=e.touches[0];onDrag({clientX:t.clientX,clientY:t.clientY})}

function endDrag(e){
  document.removeEventListener('mousemove',onDrag);
  document.removeEventListener('mouseup',endDrag);
  document.removeEventListener('touchmove',onTD);
  document.removeEventListener('touchend',onTE);
  eFig.style.filter='';
  if(dg){dg.remove();dg=null}
  if(de)de.style.opacity='1';
  const er=eFig.getBoundingClientRect();
  const over=e.clientX>er.left&&e.clientX<er.right&&e.clientY>er.top&&e.clientY<er.bottom;
  const idx=di;
  di=null;dc=null;de=null;
  if(over && idx!==null && state==='player'){
    const cards=handEl.querySelectorAll('.card');
    const cEl=cards[idx];
    if(cEl){
      const r=cEl.getBoundingClientRect();
      CF(r.left+r.width/2,r.top,er.left+er.width/2,er.top+er.height/2,P.mano[idx]?.art||'',()=>execPlay(idx))
    } else execPlay(idx)
  }
}
function onTE(e){const t=e.changedTouches[0];endDrag({clientX:t.clientX,clientY:t.clientY})}

// ─── PLAY ───────────────────────────────────────────────
function onPlay(idx){
  if(state!=='player')return;
  const c=P.mano[idx];
  if(!c||!c.canP(P))return;
  const er=eFig.getBoundingClientRect();
  const cr=handEl.querySelectorAll('.card')[idx];
  if(cr){
    const r=cr.getBoundingClientRect();
    CF(r.left+r.width/2,r.top,er.left+er.width/2,er.top+er.height/2,c.art,()=>execPlay(idx))
  } else execPlay(idx)
}

function execPlay(idx){
  if(state!=='player')return;
  const res=playCard(P,E,idx);
  if(!res){console.log('execPlay: playCard returned null for idx',idx);return}
  const c=res.carta,cr=res.res;

  // Mage cast animation
  mFig.classList.remove('casting');void mFig.offsetWidth;mFig.classList.add('casting');

  const er=eFig.getBoundingClientRect();

  if(cr.t==='dmg'){
    L(`⚡ ${c.name}: ${cr.v} daño`,'d');
    eFig.classList.remove('hurt');void eFig.offsetWidth;eFig.classList.add('hurt');
    SH();
    FT(er.left+er.width/2-15,er.top-30,`-${cr.v}`,'dmg')
  }
  if(cr.t==='blo'){
    L(`${c.name}: +${cr.v} bloqueo`,'b');
    FT(window.innerWidth/2-40,window.innerHeight*0.55,`+${cr.v} BLOQ`,'block')
  }
  if(cr.t==='buf'){
    L(`🌑 ${c.name}: +${cr.v} fuerza`);
    FT(window.innerWidth/2-40,window.innerHeight*0.6,`+${cr.v} FUERZA`,'buff')
  }

  render();

  if(E.hp<=0){
    state='victory';L('🏆 ¡Victoria!','d');
    setTimeout(()=>{rT.className='v';rT.textContent='VICTORIA';rD.textContent='El poder del relicario es tuyo.';res.classList.add('show')},800);
    return
  }

  if(P.en<=0)setTimeout(endTurn,500)
}

function endTurn(){
  if(state!=='player')return;
  state='enemy';
  endPlayerTurn(P);
  L('⏭ Turno finalizado.');
  render();
  setTimeout(enemyTurn,600)
}

function enemyTurn(){
  if(E.hp<=0)return;
  eFig.classList.remove('attacking');void eFig.offsetWidth;eFig.classList.add('attacking');
  setTimeout(()=>{
    const dmg=E.dmg;
    // Apply damage
    let r=dmg;
    if(P.blo>0){const a=Math.min(P.blo,r);P.blo-=a;r-=a}
    P.pv=Math.max(0,P.pv-r);

    L(`💥 Lich Rey ataca por ${dmg}!`,'e');
    SH();
    const pr=mFig.getBoundingClientRect();
    FT(pr.left+pr.width/2-15,pr.top-20,`-${dmg}`,'dmg');
    render();

    if(P.pv<=0){
      state='defeat';L('💀 Has caído...','e');
      setTimeout(()=>{rT.className='d';rT.textContent='DERROTA';rD.textContent='Tu alma se pierde en la oscuridad...';res.classList.add('show')},600);
      return
    }
    setTimeout(playerTurn,500)
  },350)
}

function playerTurn(){
  if(state==='victory'||state==='defeat')return;
  state='player';
  startPlayerTurn(P);
  L('Tu turno. (Robas 5 cartas)');
  render()
}

function init(){
  res.classList.remove('show');logEl.innerHTML='';
  P=newPlayer();initDeck(P);
  E=newEnemy();
  L('🌑 El templo maldito despierta...');
  L('💀 ¡Lich Rey bloquea tu camino!','e');
  state='player';
  draw(P,5);
  render()
}

$('eb').addEventListener('click',endTurn);
$('rB').addEventListener('click',init);
init();
</script>
</body>
</html>
