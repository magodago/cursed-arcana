<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursed Arcana · Combate de Magia Tenebrosa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&family=Crimson+Text:ital@0;1&display=swap');

:root {
  --bg: #0a0a0f;
  --text: #e0d6c8;
  --text-muted: rgba(224,214,200,0.45);
  --blood: #8b0000;
  --blood-light: #cc1111;
  --purple: #4a0072;
  --purple-glow: #6a0dad;
  --emerald: #00b8a0;
  --emerald-glow: #00e6c8;
  --orange: #ff6b35;
  --gold: #c9a84c;
  --card-bg: rgba(10,10,15,0.88);
  --card-border: rgba(106,13,173,0.25);
  --card-border-hover: rgba(106,13,173,0.6);
  --shadow: 0 4px 30px rgba(0,0,0,0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Crimson Text', 'MedievalSharp', serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
  -webkit-user-select: none;
}

.bg-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(139,0,0,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(74,0,114,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 20%, rgba(0,184,160,0.03) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 80%, rgba(106,13,173,0.03) 0%, transparent 40%);
  pointer-events: none;
}

.title-bar {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 10; padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, transparent 100%);
  pointer-events: none;
}

.title-bar h1 {
  font-family: 'Uncial Antiqua', serif;
  font-size: 16px; letter-spacing: 6px; text-transform: uppercase;
  background: linear-gradient(135deg, var(--blood-light), var(--purple-glow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.title-bar .version {
  font-size: 10px; color: var(--text-muted); letter-spacing: 2px;
  -webkit-text-fill-color: var(--text-muted);
}

.game-container {
  position: relative; z-index: 1;
  height: 100vh; display: flex; flex-direction: column;
  padding: 48px 20px 16px;
}

/* ─── ENEMY ───────────────────────────────────────── */

.enemy-zone {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; min-height: 0;
}

.enemy-sprite {
  width: 128px; height: 128px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  filter: drop-shadow(0 0 30px rgba(139,0,0,0.3));
  animation: enemyFloat 3s ease-in-out infinite;
  transition: filter 0.3s;
}

.enemy-sprite img {
  width: 100%; height: 100%; object-fit: contain;
  image-rendering: pixelated;
  transform: scale(1.15);
}

@keyframes enemyFloat {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}

.enemy-sprite.hurt {
  animation: enemyHurt 0.3s ease;
}

@keyframes enemyHurt {
  0%, 100% { filter: drop-shadow(0 0 30px rgba(139,0,0,0.3)); }
  25% { filter: drop-shadow(0 0 60px rgba(255,0,0,0.8)); transform: translateX(4px); }
  50% { transform: translateX(-4px); }
  75% { filter: drop-shadow(0 0 60px rgba(255,0,0,0.8)); }
}

.enemy-name {
  font-family: 'MedievalSharp', serif;
  font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--text-muted); margin-top: 6px;
}

.enemy-bar-wrap { width: 280px; max-width: 90vw; margin-top: 6px; }

.enemy-hp-bar {
  height: 6px; background: rgba(255,255,255,0.06);
  border-radius: 3px; overflow: hidden;
}

.enemy-hp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blood), var(--blood-light));
  border-radius: 3px; transition: width 0.5s ease;
  box-shadow: 0 0 10px rgba(139,0,0,0.4);
}

.enemy-hp-text {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--text-muted); margin-top: 3px;
}

.enemy-intent {
  margin-top: 6px; font-size: 11px; color: var(--blood-light);
  letter-spacing: 2px; text-transform: uppercase; opacity: 0.8;
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(106,13,173,0.15), transparent);
  margin: 4px 40px; flex-shrink: 0;
}

/* ─── PLAYER ──────────────────────────────────────── */

.player-zone {
  flex-shrink: 0; padding: 8px 0 4px;
  display: flex; align-items: center; justify-content: center; gap: 24px;
}

.player-stat {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 16px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
}

.player-stat .icon { font-size: 16px; }

.player-stat .value {
  font-family: 'MedievalSharp', serif;
  font-size: 18px; font-weight: 700;
  min-width: 24px; text-align: center;
}

.player-stat .value.health { color: var(--blood-light); }
.player-stat .value.block { color: var(--emerald); }
.player-stat .value.energy { color: var(--purple-glow); }
.player-stat .max { font-size: 12px; color: var(--text-muted); }

.pile-info {
  display: flex; gap: 12px; justify-content: center;
  flex-shrink: 0; padding: 2px 0 4px;
}

.pile-badge {
  font-size: 10px; color: var(--text-muted); letter-spacing: 1px;
}

.pile-badge span { color: var(--gold); font-weight: 700; }

/* ─── HAND ────────────────────────────────────────── */

.hand-zone {
  flex-shrink: 0; display: flex; align-items: center;
  justify-content: center; gap: 6px; padding: 4px 8px 0;
  min-height: 150px; perspective: 800px;
}

/* ─── CARD ────────────────────────────────────────── */

.card {
  width: 90px; height: 130px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  display: flex; flex-direction: column;
  cursor: pointer; flex-shrink: 0;
  transition: transform 0.2s ease, border-color 0.2s, box-shadow 0.2s;
  position: relative; box-shadow: var(--shadow);
  overflow: hidden;
}

.card:hover {
  transform: translateY(-12px) scale(1.05);
  border-color: var(--card-border-hover);
  box-shadow: 0 8px 40px rgba(106,13,173,0.25), var(--shadow);
  z-index: 5;
}

.card:active { transform: translateY(-6px) scale(0.98); }

.card.playable { border-color: rgba(106,13,173,0.3); }

.card.playable:hover {
  border-color: var(--purple-glow);
  box-shadow: 0 8px 40px rgba(106,13,173,0.35), var(--shadow);
}

.card.disabled {
  opacity: 0.4; cursor: not-allowed; filter: grayscale(0.5);
}

.card.disabled:hover {
  transform: none; border-color: var(--card-border); box-shadow: var(--shadow);
}

.card-strip {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
}

.card-strip.attack { background: linear-gradient(90deg, var(--blood), var(--blood-light)); }
.card-strip.skill { background: linear-gradient(90deg, var(--emerald), var(--emerald-glow)); }
.card-strip.power { background: linear-gradient(90deg, var(--purple), var(--purple-glow)); }

.card-cost {
  position: absolute; top: 6px; left: 6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--purple); border: 1px solid var(--purple-glow);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: #fff;
  box-shadow: 0 0 8px rgba(106,13,173,0.3);
}

.card-art {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 4px; overflow: hidden;
}

.card-art img {
  width: 54px; height: 54px; object-fit: contain;
  image-rendering: pixelated;
}

.card-name {
  font-family: 'MedievalSharp', serif;
  font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
  text-align: center; padding: 0 6px; line-height: 1.2; color: var(--text);
}

.card-desc {
  font-family: 'Crimson Text', serif;
  font-size: 9px; color: var(--text-muted);
  text-align: center; padding: 0 6px 5px; line-height: 1.3; font-style: italic;
}

.card-type {
  position: absolute; top: 6px; right: 6px;
  font-size: 7px; letter-spacing: 1px; text-transform: uppercase;
  opacity: 0.5;
}

.card-type.attack { color: var(--blood-light); }
.card-type.skill { color: var(--emerald); }
.card-type.power { color: var(--purple-glow); }

.end-turn-btn {
  position: fixed; bottom: 20px; right: 24px; z-index: 10;
  padding: 10px 24px; background: transparent;
  border: 1px solid var(--blood); color: var(--blood-light);
  font-family: 'MedievalSharp', serif;
  font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
  cursor: pointer; transition: all 0.3s;
}

.end-turn-btn:hover { background: rgba(139,0,0,0.1); box-shadow: 0 0 20px rgba(139,0,0,0.15); }
.end-turn-btn:active { transform: scale(0.97); }

.battle-log {
  position: fixed; bottom: 60px; left: 24px; z-index: 10;
  max-width: 280px; pointer-events: none;
}

.battle-log p {
  font-family: 'Crimson Text', serif; font-style: italic;
  font-size: 12px; color: var(--text-muted);
  opacity: 0; animation: logFade 2s ease forwards;
  margin-bottom: 2px;
}

.battle-log p.damage { color: var(--blood-light); }
.battle-log p.block { color: var(--emerald); }
.battle-log p.heal { color: var(--emerald-glow); }
.battle-log p.info { color: var(--text-muted); }
.battle-log p.enemy-dmg { color: var(--orange); }

@keyframes logFade {
  0% { opacity: 0; transform: translateY(6px); }
  15% { opacity: 1; transform: translateY(0); }
  80% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-4px); }
}

.result-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100; display: none;
  align-items: center; justify-content: center; flex-direction: column;
  background: rgba(10,10,15,0.92); backdrop-filter: blur(8px);
  animation: resultFade 0.5s ease;
}

.result-overlay.show { display: flex; }

@keyframes resultFade { from { opacity: 0; } to { opacity: 1; } }

.result-overlay h2 {
  font-family: 'Uncial Antiqua', serif;
  font-size: 42px; letter-spacing: 8px; margin-bottom: 8px;
}

.result-overlay h2.victoria {
  background: linear-gradient(135deg, var(--gold), var(--emerald));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.result-overlay h2.derrota {
  background: linear-gradient(135deg, var(--blood), var(--blood-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.result-overlay p {
  font-family: 'Crimson Text', serif;
  font-size: 15px; color: var(--text-muted); margin-bottom: 24px; font-style: italic;
}

.result-overlay .restart-btn {
  padding: 12px 36px; background: transparent;
  border: 1px solid var(--gold); color: var(--gold);
  font-family: 'MedievalSharp', serif;
  font-size: 14px; letter-spacing: 4px; text-transform: uppercase;
  cursor: pointer; transition: all 0.3s;
}

.result-overlay .restart-btn:hover {
  background: rgba(201,168,76,0.1); box-shadow: 0 0 30px rgba(201,168,76,0.1);
}

@media (max-width: 600px) {
  .card { width: 72px; height: 108px; }
  .card-art img { width: 42px; height: 42px; }
  .card-name { font-size: 8px; }
  .card-desc { font-size: 7px; padding-bottom: 4px; }
  .card-cost { width: 18px; height: 18px; font-size: 10px; }
  .enemy-sprite { width: 96px; height: 96px; }
  .enemy-bar-wrap { width: 200px; }
  .player-stat { padding: 4px 10px; gap: 4px; }
  .player-stat .value { font-size: 14px; }
  .hand-zone { gap: 4px; min-height: 120px; }
  .title-bar h1 { font-size: 13px; letter-spacing: 4px; }
}
</style>
</head>
<body>

<div class="bg-overlay"></div>

<div class="title-bar">
  <h1>Cursed Arcana</h1>
  <span class="version">v0.1 · Prólogo</span>
</div>

<div class="game-container">

  <div class="enemy-zone" id="enemyZone">
    <div class="enemy-sprite" id="enemySprite">
      <img src="assets/enemy_bone_wraith.png" alt="Enemigo">
    </div>
    <div class="enemy-name" id="enemyName">ESQUELETO MALDITO</div>
    <div class="enemy-bar-wrap">
      <div class="enemy-hp-bar"><div class="enemy-hp-fill" id="enemyHpFill" style="width:100%"></div></div>
      <div class="enemy-hp-text">
        <span id="enemyHpText">8 / 8</span>
        <span id="enemyIntent">⚔️ INTENCIÓN: ATACAR</span>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="player-zone">
    <div class="player-stat"><span class="icon">❤️</span><span class="value health" id="playerHealth">30</span><span class="max">/ 30</span></div>
    <div class="player-stat"><span class="icon">🛡️</span><span class="value block" id="playerBlock">0</span></div>
    <div class="player-stat"><span class="icon">🔮</span><span class="value energy" id="playerEnergy">3</span><span class="max">/ 3</span></div>
  </div>

  <div class="pile-info">
    <span class="pile-badge">📜 Mazo: <span id="drawCount">5</span></span>
    <span class="pile-badge">🗑️ Descarte: <span id="discardCount">0</span></span>
  </div>

  <div class="hand-zone" id="handZone"></div>
</div>

<button class="end-turn-btn" id="endTurnBtn">⏭ Finalizar Turno</button>

<div class="battle-log" id="battleLog"></div>

<div class="result-overlay" id="resultOverlay">
  <h2 id="resultTitle">VICTORIA</h2>
  <p id="resultDesc">La oscuridad se retira... por ahora.</p>
  <button class="restart-btn" id="restartBtn">⟳ Levantarse de Nuevo</button>
</div>

<script>
/* ════════════════════════════════════════════════════════
   CURSED ARCANA — Motor de Combate v0.1
   ════════════════════════════════════════════════════════ */

// ─── CARTAS ─────────────────────────────────────────────

const CARTAS = [
  {
    id: 'golpe_arcano',
    nombre: 'Golpe Arcano',
    tipo: 'attack',
    coste: 1,
    arte: 'assets/icon_arcane_strike.png',
    desc: 'Inflige 6 de daño.',
    efecto: (objetivo, jugador) => {
      const dmg = 6 + (jugador.fuerza || 0);
      objetivo.recibirDanio(dmg);
      return { tipo: 'damage', valor: dmg };
    }
  },
  {
    id: 'escudo_espectral',
    nombre: 'Escudo Espectral',
    tipo: 'skill',
    coste: 1,
    arte: 'assets/icon_spectral_shield.png',
    desc: 'Gana 5 de Bloqueo.',
    efecto: (objetivo, jugador) => {
      jugador.ganarBloqueo(5);
      return { tipo: 'block', valor: 5 };
    }
  },
  {
    id: 'drenar_vida',
    nombre: 'Drenar Vida',
    tipo: 'attack',
    coste: 2,
    arte: 'assets/icon_drain_life.png',
    desc: '4 de daño. Recupera 3 PV.',
    efecto: (objetivo, jugador) => {
      objetivo.recibirDanio(4);
      jugador.curar(3);
      return { tipo: 'drain', valor: 4 };
    }
  },
  {
    id: 'abisso_oscuro',
    nombre: 'Abismo Oscuro',
    tipo: 'power',
    coste: 2,
    arte: 'assets/icon_dark_rift.png',
    desc: 'Gana 2 de Fuerza permanente.',
    efecto: (objetivo, jugador) => {
      jugador.fuerza = (jugador.fuerza || 0) + 2;
      return { tipo: 'buff', valor: 2 };
    }
  },
];

// ─── ENEMIGOS ───────────────────────────────────────────

const ENEMIGOS = [
  {
    id: 'esqueleto_maldito',
    nombre: 'Esqueleto Maldito',
    arte: 'assets/enemy_bone_wraith.png',
    pvMax: 8,
    danio: 4,
    textoIntencion: '⚔️ INTENCIÓN: ATACAR',
  },
];

// ─── CLASE CARTA ────────────────────────────────────────

class Carta {
  constructor(plantilla) {
    this.id = plantilla.id;
    this.nombre = plantilla.nombre;
    this.tipo = plantilla.tipo;
    this.coste = plantilla.coste;
    this.arte = plantilla.arte;
    this.desc = plantilla.desc;
    this.efecto = plantilla.efecto;
  }

  sePuedeJugar(jugador) {
    return jugador.energia >= this.coste;
  }
}

// ─── CLASE ENEMIGO ──────────────────────────────────────

class Enemigo {
  constructor(plantilla) {
    this.id = plantilla.id;
    this.nombre = plantilla.nombre;
    this.arte = plantilla.arte;
    this.pvMax = plantilla.pvMax;
    this.pv = plantilla.pvMax;
    this.danio = plantilla.danio;
    this.textoIntencion = plantilla.textoIntencion;
    this.bloqueo = 0;
  }

  recibirDanio(cantidad) {
    let restante = cantidad;
    if (this.bloqueo > 0) {
      const absorbido = Math.min(this.bloqueo, restante);
      this.bloqueo -= absorbido;
      restante -= absorbido;
    }
    this.pv = Math.max(0, this.pv - restante);
  }

  estaVivo() { return this.pv > 0; }

  actuar(jugador) {
    const danioFinal = this.danio;
    jugador.recibirDanio(danioFinal);
    return { tipo: 'attack', valor: danioFinal };
  }
}

// ─── CLASE JUGADOR ──────────────────────────────────────

class Jugador {
  constructor() {
    this.pvMax = 30;
    this.pv = 30;
    this.bloqueo = 0;
    this.energiaMax = 3;
    this.energia = 3;
    this.fuerza = 0;
    this.mazo = [];
    this.mano = [];
    this.descarte = [];
  }

  initMazo() {
    const cartas = [];
    for (let i = 0; i < 3; i++) cartas.push(new Carta(CARTAS[0]));
    for (let i = 0; i < 3; i++) cartas.push(new Carta(CARTAS[1]));
    for (let i = 0; i < 2; i++) cartas.push(new Carta(CARTAS[2]));
    cartas.push(new Carta(CARTAS[3]));
    this.mazo = this.barajar(cartas);
    this.descarte = [];
    this.mano = [];
    this.bloqueo = 0;
    this.fuerza = 0;
    this.energia = this.energiaMax;
  }

  barajar(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  robar(count) {
    let robadas = 0;
    for (let i = 0; i < count; i++) {
      if (this.mazo.length === 0) {
        if (this.descarte.length === 0) break;
        this.mazo = this.barajar(this.descarte);
        this.descarte = [];
        agregarLog('📜 Mazo rebarajado...', 'info');
      }
      this.mano.push(this.mazo.pop());
      robadas++;
    }
    return robadas;
  }

  ganarBloqueo(cantidad) { this.bloqueo += cantidad; }

  recibirDanio(cantidad) {
    let restante = cantidad;
    if (this.bloqueo > 0) {
      const absorbido = Math.min(this.bloqueo, restante);
      this.bloqueo -= absorbido;
      restante -= absorbido;
    }
    this.pv = Math.max(0, this.pv - restante);
  }

  curar(cantidad) { this.pv = Math.min(this.pvMax, this.pv + cantidad); }

  estaVivo() { return this.pv > 0; }

  jugarCarta(indice, enemigo) {
    const carta = this.mano[indice];
    if (!carta) return null;
    if (!carta.sePuedeJugar(this)) return null;
    this.energia -= carta.coste;
    this.mano.splice(indice, 1);
    this.descarte.push(carta);
    const resultado = carta.efecto(enemigo, this);
    return { carta, resultado };
  }

  terminarTurno() {
    while (this.mano.length > 0) this.descarte.push(this.mano.pop());
    this.bloqueo = 0;
    this.energia = this.energiaMax;
  }

  empezarTurno() {
    this.bloqueo = 0;
    this.energia = this.energiaMax;
    this.robar(5);
  }
}

// ─── ESTADO DEL JUEGO ──────────────────────────────────

let jugador = null;
let enemigo = null;
let estado = 'idle'; // idle, turnoJugador, turnoEnemigo, victoria, derrota

const $ = id => document.getElementById(id);
const enemigoSprite = $('enemySprite');
const enemigoImg = enemigoSprite.querySelector('img');
const enemigoNombre = $('enemyName');
const enemigoBarra = $('enemyHpFill');
const enemigoTexto = $('enemyHpText');
const enemigoIntencion = $('enemyIntent');
const jugadorVida = $('playerHealth');
const jugadorBloqueo = $('playerBlock');
const jugadorEnergia = $('playerEnergy');
const zonaMano = $('handZone');
const contadorMazo = $('drawCount');
const contadorDescarte = $('discardCount');
const registro = $('battleLog');
const btnFinTurno = $('endTurnBtn');
const overlayResultado = $('resultOverlay');
const tituloResultado = $('resultTitle');
const descResultado = $('resultDesc');
const btnReiniciar = $('restartBtn');

// ─── LOG ────────────────────────────────────────────────

function agregarLog(texto, tipo = 'info') {
  const p = document.createElement('p');
  p.className = tipo;
  p.textContent = texto;
  registro.appendChild(p);
  while (registro.children.length > 5) registro.removeChild(registro.firstChild);
}

// ─── RENDER ─────────────────────────────────────────────

function renderizar() {
  if (!jugador || !enemigo) return;

  const porc = (enemigo.pv / enemigo.pvMax) * 100;
  enemigoBarra.style.width = porc + '%';
  enemigoTexto.textContent = `${enemigo.pv} / ${enemigo.pvMax}`;
  enemigoIntencion.textContent = enemigo.textoIntencion;
  enemigoNombre.textContent = enemigo.nombre;
  enemigoImg.src = enemigo.arte;

  jugadorVida.textContent = jugador.pv;
  jugadorBloqueo.textContent = jugador.bloqueo;
  jugadorEnergia.textContent = jugador.energia;

  contadorMazo.textContent = jugador.mazo.length;
  contadorDescarte.textContent = jugador.descarte.length;

  renderizarMano();
}

function renderizarMano() {
  zonaMano.innerHTML = '';
  jugador.mano.forEach((carta, indice) => {
    const el = document.createElement('div');
    el.className = 'card' + (carta.sePuedeJugar(jugador) && estado === 'turnoJugador' ? ' playable' : ' disabled');
    el.dataset.index = indice;

    el.innerHTML = `
      <div class="card-strip ${carta.tipo}"></div>
      <div class="card-cost">${carta.coste}</div>
      <div class="card-type ${carta.tipo}">${carta.tipo === 'attack' ? 'ataque' : carta.tipo === 'skill' ? 'habilidad' : 'poder'}</div>
      <div class="card-art"><img src="${carta.arte}" alt="${carta.nombre}"></div>
      <div class="card-name">${carta.nombre}</div>
      <div class="card-desc">${carta.desc}</div>
    `;

    if (carta.sePuedeJugar(jugador) && estado === 'turnoJugador') {
      el.addEventListener('click', () => alJugarCarta(indice));
    }

    zonaMano.appendChild(el);
  });
}

function mostrarResultado(victoria) {
  overlayResultado.classList.add('show');
  if (victoria) {
    tituloResultado.className = 'victoria';
    tituloResultado.textContent = 'VICTORIA';
    descResultado.textContent = 'El relicario maldito es tuyo... por ahora.';
  } else {
    tituloResultado.className = 'derrota';
    tituloResultado.textContent = 'DERROTA';
    descResultado.textContent = 'Tu alma se une a las incontables otras...';
  }
}

function ocultarResultado() {
  overlayResultado.classList.remove('show');
}

// ─── ACCIONES ────────────────────────────────────────────

function alJugarCarta(indice) {
  if (estado !== 'turnoJugador') return;

  const resultado = jugador.jugarCarta(indice, enemigo);
  if (!resultado) return;

  const { carta, resultado: r } = resultado;

  if (r.tipo === 'damage') {
    agregarLog(`⚡ ${carta.nombre}: ${r.valor} de daño`, 'damage');
    const img = enemigoSprite.querySelector('img');
    img.style.animation = 'none';
    void img.offsetWidth;
    img.style.animation = '';
    enemigoSprite.classList.remove('hurt');
    void enemigoSprite.offsetWidth;
    enemigoSprite.classList.add('hurt');
  } else if (r.tipo === 'block') {
    agregarLog(`🛡️ ${carta.nombre}: +${r.valor} Bloqueo`, 'block');
  } else if (r.tipo === 'drain') {
    agregarLog(`🔮 ${carta.nombre}: ${r.valor} dmg +${3} curación`, 'heal');
    enemigoSprite.classList.remove('hurt');
    void enemigoSprite.offsetWidth;
    enemigoSprite.classList.add('hurt');
  } else if (r.tipo === 'buff') {
    agregarLog(`🌑 ${carta.nombre}: +${r.valor} Fuerza`, 'info');
  }

  renderizar();

  if (!enemigo.estaVivo()) {
    estado = 'victoria';
    agregarLog('🏆 ¡Enemigo derrotado!', 'info');
    setTimeout(() => mostrarResultado(true), 600);
    return;
  }

  if (jugador.energia <= 0) {
    setTimeout(() => terminarTurnoJugador(), 400);
  }
}

function terminarTurnoJugador() {
  if (estado !== 'turnoJugador') return;
  estado = 'turnoEnemigo';
  jugador.terminarTurno();
  agregarLog('⏭ Turno finalizado.', 'info');
  renderizar();

  setTimeout(() => {
    turnoEnemigo();
  }, 500);
}

function turnoEnemigo() {
  if (!enemigo.estaVivo()) return;

  const intencion = enemigo.actuar(jugador);
  agregarLog(`💥 ${enemigo.nombre} ataca por ${intencion.valor}!`, 'enemy-dmg');
  renderizar();

  enemigoSprite.style.animation = 'none';
  void enemigoSprite.offsetWidth;
  enemigoSprite.style.animation = 'enemyFloat 3s ease-in-out infinite';

  if (!jugador.estaVivo()) {
    estado = 'derrota';
    agregarLog('💀 Has caído...', 'info');
    setTimeout(() => mostrarResultado(false), 600);
    return;
  }

  setTimeout(() => {
    empezarTurnoJugador();
  }, 500);
}

function empezarTurnoJugador() {
  if (estado === 'victoria' || estado === 'derrota') return;
  estado = 'turnoJugador';
  jugador.empezarTurno();
  agregarLog('🔮 Tu turno. (Robas 5 cartas)', 'info');
  renderizar();
}

// ─── INICIO ─────────────────────────────────────────────

function iniciarJuego() {
  ocultarResultado();
  jugador = new Jugador();
  jugador.initMazo();
  enemigo = new Enemigo(ENEMIGOS[0]);
  registro.innerHTML = '';
  agregarLog('🌑 El templo maldito despierta...', 'info');
  agregarLog(`💀 ¡${enemigo.nombre} bloquea tu camino!`, 'enemy-dmg');
  renderizar();
  estado = 'turnoJugador';
  jugador.robar(5);
  renderizar();
}

btnFinTurno.addEventListener('click', terminarTurnoJugador);
btnReiniciar.addEventListener('click', iniciarJuego);

iniciarJuego();
</script>
</body>
</html>
