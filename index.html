<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursed Arcana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Crimson Text', serif;
  background: #000;
  color: #e0d6c8;
  overflow: hidden;
  height: 100vh; width: 100vw;
  user-select: none;
  -webkit-user-select: none;
}

/* ═══════ BG ═══════ */

.bg-layer {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
  background: url(assets/bg_battle.png) center center / cover no-repeat;
  filter: brightness(0.6) saturate(1.2);
  transition: filter 0.3s;
}

.bg-layer::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.6) 100%);
}

/* ═══════ VIGNETTE OVERLAY ═══════ */

.vignette {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1;
  pointer-events: none;
  box-shadow: inset 0 0 150px rgba(0,0,0,0.7);
}

/* ═══════ TITLE ═══════ */

.title-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  padding: 12px 28px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
  pointer-events: none;
}

.title-bar h1 {
  font-family: 'Uncial Antiqua', serif;
  font-size: 15px; letter-spacing: 6px;
  background: linear-gradient(135deg, #cc1111, #6a0dad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.title-bar .vs {
  font-size: 10px; color: rgba(224,214,200,0.35);
  letter-spacing: 3px;
  -webkit-text-fill-color: rgba(224,214,200,0.35);
}

/* ═══════ GAME LAYER ═══════ */

.game-layer {
  position: relative; z-index: 2;
  height: 100vh;
  display: flex; flex-direction: column;
}

/* ═══════ ENEMY AREA ═══════ */

.enemy-area {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding-bottom: 12px;
}

.enemy-hp-bar-bg {
  width: 280px; max-width: 80vw; margin-bottom: 4px;
}

.enemy-hp-row {
  display: flex; justify-content: space-between;
  font-size: 11px; color: rgba(224,214,200,0.5);
  margin-bottom: 2px;
}

.enemy-hp-row .hp-label {
  letter-spacing: 2px; font-family: 'MedievalSharp', serif;
  text-transform: uppercase; font-size: 10px;
}

.enemy-hp-row .hp-num {
  font-family: 'MedievalSharp', serif; color: #cc1111;
}

.enemy-hp-track {
  height: 5px; background: rgba(255,255,255,0.06);
  border-radius: 3px; overflow: hidden;
}

.enemy-hp-fill {
  height: 100%;
  background: linear-gradient(90deg, #6a0dad, #cc1111);
  border-radius: 3px;
  transition: width 0.4s ease;
  box-shadow: 0 0 8px rgba(204,17,17,0.3);
}

.enemy-sprite-wrap {
  position: relative;
  width: 140px; height: 140px;
  display: flex; align-items: center; justify-content: center;
}

.enemy-sprite-wrap img {
  width: 128px; height: 128px;
  object-fit: contain;
  image-rendering: pixelated;
  animation: enemyIdle 2.5s ease-in-out infinite;
  filter: drop-shadow(0 0 30px rgba(139,0,0,0.25));
}

.enemy-sprite-wrap.attacking img {
  animation: enemyAttack 0.4s ease !important;
}

@keyframes enemyIdle {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-5px) scale(1.02); }
}

@keyframes enemyAttack {
  0% { transform: translateX(0) scale(1); }
  30% { transform: translateX(20px) scale(1.1); filter: drop-shadow(0 0 50px rgba(204,17,17,0.6)); }
  60% { transform: translateX(-10px) scale(0.95); }
  100% { transform: translateX(0) scale(1); }
}

.enemy-intent {
  font-size: 10px; letter-spacing: 3px;
  color: #cc1111; text-transform: uppercase;
  margin-top: 4px; font-family: 'MedievalSharp', serif;
  opacity: 0.7;
}

/* ═══════ PLAYER AREA ═══════ */

.player-area {
  flex-shrink: 0;
  display: flex; align-items: flex-end;
  justify-content: space-between;
  padding: 0 20px;
}

.player-info {
  display: flex; gap: 12px;
}

.player-stat {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.08);
}

.player-stat .ico { font-size: 13px; }

.player-stat .val {
  font-family: 'MedievalSharp', serif;
  font-size: 16px; font-weight: 700;
  min-width: 20px; text-align: center;
}

.player-stat .val.hp { color: #cc1111; }
.player-stat .val.block { color: #00b8a0; }
.player-stat .val.energy { color: #6a0dad; }

.player-stat .sep { font-size: 11px; color: rgba(224,214,200,0.3); }

.player-mage {
  width: 100px; height: 100px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: -10px;
}

.player-mage img {
  height: 100px; width: auto;
  object-fit: contain;
  image-rendering: pixelated;
  animation: mageIdle 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(106,13,173,0.2));
}

.player-mage.attacking img {
  animation: mageAttack 0.35s ease !important;
}

@keyframes mageIdle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@keyframes mageAttack {
  0% { transform: translateX(0); }
  30% { transform: translateX(-15px) scale(1.05); filter: drop-shadow(0 0 40px rgba(106,13,173,0.6)); }
  100% { transform: translateX(0); }
}

.pile-info {
  font-size: 10px; color: rgba(224,214,200,0.3);
  letter-spacing: 1px; text-align: right;
  padding: 4px 12px;
}
.pile-info span { color: #c9a84c; font-weight: 700; }

/* ═══════ INTENT INDICATOR ═══════ */

.intent-arrow {
  font-size: 20px; margin-bottom: -4px;
  opacity: 0.6;
}

/* ═══════ HAND / FAN ═══════ */

.hand-area {
  flex-shrink: 0;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0 30px 10px;
  min-height: 200px;
  perspective: 1200px;
}

/* ═══════ CARD ═══════ */

.card {
  width: 180px; height: 252px;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
  margin: 0 -36px;
  transition: transform 0.25s ease, margin 0.25s ease, filter 0.2s;
  transform-origin: bottom center;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
  border: 1px solid rgba(106,13,173,0.2);
}

.card:nth-child(1) { transform: rotate(-10deg) translateY(6px); z-index: 1; }
.card:nth-child(2) { transform: rotate(-5deg) translateY(2px); z-index: 2; }
.card:nth-child(3) { transform: rotate(0deg) translateY(0); z-index: 3; }
.card:nth-child(4) { transform: rotate(5deg) translateY(2px); z-index: 2; }
.card:nth-child(5) { transform: rotate(10deg) translateY(6px); z-index: 1; }
.card:nth-child(6) { transform: rotate(14deg) translateY(10px); z-index: 1; }
.card:nth-child(7) { transform: rotate(-14deg) translateY(10px); z-index: 1; }

.card:hover {
  transform: rotate(0deg) translateY(-40px) scale(1.12) !important;
  z-index: 10 !important;
  margin: 0 -20px;
  border-color: rgba(106,13,173,0.5);
}

.card.disabled {
  filter: grayscale(0.6) brightness(0.5);
  cursor: not-allowed;
}

.card.disabled:hover {
  transform: none !important;
  z-index: initial !important;
  margin: 0 -36px;
}

.card-border {
  position: absolute;
  top: 2px; left: 2px; right: 2px; bottom: 2px;
  border: 1px solid rgba(106,13,173,0.15);
  pointer-events: none;
}

.card-art {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}

.card-art img {
  width: 100%; height: 100%;
  object-fit: cover;
  image-rendering: pixelated;
  transition: transform 0.3s;
}

.card:hover .card-art img {
  transform: scale(1.05);
}

.card-strip {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  z-index: 3;
}
.card-strip.attack { background: linear-gradient(90deg, #8b0000, #cc1111); }
.card-strip.skill { background: linear-gradient(90deg, #007a6a, #00b8a0); }
.card-strip.power { background: linear-gradient(90deg, #4a0072, #6a0dad); }

.card-cost {
  position: absolute;
  top: 6px; left: 6px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #6a0dad, #3a0050);
  border: 1px solid rgba(106,13,173,0.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: #fff;
  z-index: 4;
  box-shadow: 0 0 10px rgba(106,13,173,0.3);
}

.card-name {
  position: absolute;
  bottom: 34px; left: 8px; right: 8px;
  font-family: 'MedievalSharp', serif;
  font-size: 11px; letter-spacing: 1px;
  text-align: center;
  color: #e0d6c8;
  z-index: 4;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
  background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 100%);
  padding: 6px 4px 2px;
}

.card-desc {
  position: absolute;
  bottom: 10px; left: 8px; right: 8px;
  font-family: 'Crimson Text', serif;
  font-style: italic;
  font-size: 9px;
  text-align: center;
  color: rgba(224,214,200,0.65);
  z-index: 4;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  line-height: 1.3;
}

/* ═══════ END TURN ═══════ */

.end-turn {
  position: fixed; bottom: 24px; right: 24px; z-index: 10;
  padding: 10px 22px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(204,17,17,0.3);
  color: rgba(204,17,17,0.7);
  font-family: 'MedievalSharp', serif;
  font-size: 11px; letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s;
}

.end-turn:hover {
  background: rgba(139,0,0,0.15);
  border-color: rgba(204,17,17,0.6);
  color: #cc1111;
}

/* ═══════ BATTLE LOG ═══════ */

.battle-log {
  position: fixed; bottom: 70px; left: 24px; z-index: 10;
  max-width: 240px; pointer-events: none;
}

.battle-log p {
  font-family: 'Crimson Text', serif;
  font-style: italic; font-size: 12px;
  color: rgba(224,214,200,0.5);
  opacity: 0; animation: logFade 2.5s ease forwards;
  margin-bottom: 1px;
}

.battle-log p.damage { color: #cc1111; }
.battle-log p.block { color: #00b8a0; }
.battle-log p.heal { color: #00e6c8; }
.battle-log p.enemy-dmg { color: #ff6b35; }

@keyframes logFade {
  0% { opacity: 0; transform: translateY(6px); }
  15% { opacity: 1; transform: translateY(0); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-4px); }
}

/* ═══════ RESULT ═══════ */

.result-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: none;
  align-items: center; justify-content: center; flex-direction: column;
  background: rgba(0,0,0,0.88);
}

.result-overlay.show { display: flex; }

.result-overlay h2 {
  font-family: 'Uncial Antiqua', serif;
  font-size: 48px; letter-spacing: 10px; margin-bottom: 10px;
}

.result-overlay h2.victory {
  background: linear-gradient(135deg, #c9a84c, #00b8a0);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.result-overlay h2.defeat {
  background: linear-gradient(135deg, #8b0000, #cc1111);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.result-overlay p {
  font-size: 15px; color: rgba(224,214,200,0.5);
  margin-bottom: 24px; font-style: italic;
}

.result-overlay button {
  padding: 12px 36px;
  background: transparent;
  border: 1px solid #c9a84c;
  color: #c9a84c;
  font-family: 'MedievalSharp', serif;
  font-size: 14px; letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.3s;
}

.result-overlay button:hover {
  background: rgba(201,168,76,0.1);
}

/* ═══════ SCREEN SHAKE ═══════ */

.shake {
  animation: shake 0.3s ease;
}

@keyframes shake {
  0%, 100% { transform: translate(0); }
  20% { transform: translate(-4px, 2px); }
  40% { transform: translate(3px, -3px); }
  60% { transform: translate(-2px, 1px); }
  80% { transform: translate(2px, -1px); }
}

/* ═══════ RESPONSIVE ═══════ */

@media (max-width: 700px) {
  .card { width: 130px; height: 182px; margin: 0 -32px; }
  .card-cost { width: 22px; height: 22px; font-size: 12px; }
  .card-name { font-size: 9px; bottom: 28px; }
  .card-desc { font-size: 8px; bottom: 6px; }
  .hand-area { padding: 0 10px 6px; min-height: 160px; }
  .card:nth-child(1) { transform: rotate(-8deg) translateY(6px); }
  .card:nth-child(5) { transform: rotate(8deg) translateY(6px); }
  .enemy-sprite-wrap { width: 100px; height: 100px; }
  .enemy-sprite-wrap img { width: 90px; height: 90px; }
  .player-mage { width: 70px; height: 70px; }
  .player-mage img { height: 70px; }
  .title-bar h1 { font-size: 12px; letter-spacing: 4px; }
}

@media (max-width: 450px) {
  .card { width: 100px; height: 140px; margin: 0 -28px; }
  .card-cost { width: 18px; height: 18px; font-size: 10px; top: 4px; left: 4px; }
  .card-name { font-size: 7px; bottom: 22px; }
  .card-desc { font-size: 6px; bottom: 4px; }
  .hand-area { min-height: 130px; }
  .card-strip { height: 2px; }
}
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="vignette"></div>

<div class="title-bar">
  <h1>Cursed Arcana</h1>
  <span class="vs">vs Esqueleto Maldito</span>
</div>

<div class="game-layer" id="gameLayer">

  <!-- ENEMY -->
  <div class="enemy-area">
    <div class="enemy-hp-bar-bg">
      <div class="enemy-hp-row">
        <span class="hp-label">✧ esqueleto maldito</span>
        <span class="hp-num" id="enemyHpNum">8 / 8</span>
      </div>
      <div class="enemy-hp-track">
        <div class="enemy-hp-fill" id="enemyHpFill" style="width:100%"></div>
      </div>
    </div>
    <div class="enemy-sprite-wrap" id="enemyWrap">
      <img src="assets/enemy_bone_wraith.png" alt="enemigo" id="enemyImg">
    </div>
    <div class="intent-arrow" id="intentArrow">🗡️</div>
    <div class="enemy-intent" id="enemyIntent">ATACAR · 4</div>
  </div>

  <!-- PLAYER & HAND -->
  <div class="player-area">
    <div class="player-info">
      <div class="player-stat"><span class="ico">❤️</span><span class="val hp" id="plHp">30</span><span class="sep">/30</span></div>
      <div class="player-stat"><span class="ico">🛡️</span><span class="val block" id="plBlock">0</span></div>
      <div class="player-stat"><span class="ico">🔮</span><span class="val energy" id="plEnergy">3</span><span class="sep">/3</span></div>
    </div>
    <div class="player-mage" id="mageWrap">
      <img src="assets/player_mage.png" alt="mago">
    </div>
    <div class="pile-info">📜 <span id="pileDraw">5</span> · 🗑️ <span id="pileDiscard">0</span></div>
  </div>

  <!-- HAND -->
  <div class="hand-area" id="handArea"></div>
</div>

<button class="end-turn" id="endTurnBtn">⏭ FINALIZAR</button>

<div class="battle-log" id="battleLog"></div>

<div class="result-overlay" id="resultOverlay">
  <h2 id="resultTitle">VICTORIA</h2>
  <p id="resultDesc">El poder del relicario es tuyo.</p>
  <button id="restartBtn">↻ VOLVER A EMPEZAR</button>
</div>

<script>
/* ════════════════════════════════════════════════════════
   CURSED ARCANA — Motor de Combate v0.2
   ════════════════════════════════════════════════════════ */

const CARTAS = [
  {
    id: 'golpe_arcano', nombre: 'Golpe Arcano', tipo: 'attack', coste: 1,
    arte: 'assets/card_strike.png',
    desc: 'Inflige 6 de daño.',
    efecto: (e, j) => { const d = 6 + (j.fuerza||0); e.recibir(d); return {t:'damage',v:d}; }
  },
  {
    id: 'escudo_espectral', nombre: 'Escudo Espectral', tipo: 'skill', coste: 1,
    arte: 'assets/card_shield.png',
    desc: 'Gana 5 de Bloqueo.',
    efecto: (e, j) => { j.ganarBloqueo(5); return {t:'block',v:5}; }
  },
  {
    id: 'drenar_vida', nombre: 'Drenar Vida', tipo: 'attack', coste: 2,
    arte: 'assets/card_drain.png',
    desc: '4 de daño. Recupera 3 PV.',
    efecto: (e, j) => { e.recibir(4); j.curar(3); return {t:'drain',v:4}; }
  },
  {
    id: 'abismo_oscuro', nombre: 'Abismo Oscuro', tipo: 'power', coste: 2,
    arte: 'assets/card_abyss.png',
    desc: 'Gana +2 Fuerza permanente.',
    efecto: (e, j) => { j.fuerza = (j.fuerza||0) + 2; return {t:'buff',v:2}; }
  },
];

class Carta {
  constructor(t) { Object.assign(this, t); }
  sePuede(j) { return j.energia >= this.coste; }
}

class Enemigo {
  constructor() {
    this.pv = 8; this.pvMax = 8; this.danio = 4;
  }
  recibir(c) {
    let r = c;
    if (this.bloqueo > 0) { const a = Math.min(this.bloqueo, r); this.bloqueo -= a; r -= a; }
    this.pv = Math.max(0, this.pv - r);
  }
  estaVivo() { return this.pv > 0; }
  actuar(j) { j.recibirDanio(this.danio); return this.danio; }
}

class Jugador {
  constructor() {
    this.pv = 30; this.pvMax = 30; this.bloqueo = 0;
    this.energia = 3; this.energiaMax = 3; this.fuerza = 0;
    this.mazo = []; this.mano = []; this.descarte = [];
  }
  init() {
    this.mazo = [];
    for (let i = 0; i < 3; i++) this.mazo.push(new Carta(CARTAS[0]));
    for (let i = 0; i < 3; i++) this.mazo.push(new Carta(CARTAS[1]));
    for (let i = 0; i < 2; i++) this.mazo.push(new Carta(CARTAS[2]));
    this.mazo.push(new Carta(CARTAS[3]));
    this.barajar();
    this.descarte = []; this.mano = [];
    this.bloqueo = 0; this.fuerza = 0; this.energia = this.energiaMax;
  }
  barajar() {
    for (let i = this.mazo.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [this.mazo[i], this.mazo[j]] = [this.mazo[j], this.mazo[i]];
    }
  }
  robar(n) {
    let r = 0;
    for (let i = 0; i < n; i++) {
      if (this.mazo.length === 0) {
        if (this.descarte.length === 0) break;
        this.mazo = this.descarte; this.descarte = [];
        this.barajar();
        log('📜 Mazo rebarajado...');
      }
      this.mano.push(this.mazo.pop()); r++;
    }
    return r;
  }
  ganarBloqueo(c) { this.bloqueo += c; }
  recibirDanio(c) {
    let r = c;
    if (this.bloqueo > 0) { const a = Math.min(this.bloqueo, r); this.bloqueo -= a; r -= a; }
    this.pv = Math.max(0, this.pv - r);
  }
  curar(c) { this.pv = Math.min(this.pvMax, this.pv + c); }
  estaVivo() { return this.pv > 0; }
  jugar(i, e) {
    const c = this.mano[i];
    if (!c || !c.sePuede(this)) return null;
    this.energia -= c.coste;
    this.mano.splice(i, 1);
    this.descarte.push(c);
    return { carta: c, res: c.efecto(e, this) };
  }
  finTurno() {
    while (this.mano.length) this.descarte.push(this.mano.pop());
    this.bloqueo = 0; this.energia = this.energiaMax;
  }
  iniTurno() { this.bloqueo = 0; this.energia = this.energiaMax; this.robar(5); }
}

let jug, ene, estado = 'idle';
const $ = id => document.getElementById(id);
const enHpNum = $('enemyHpNum'), enHpFill = $('enemyHpFill');
const enImg = $('enemyImg'), enWrap = $('enemyWrap');
const enIntent = $('enemyIntent'), intArrow = $('intentArrow');
const plHp = $('plHp'), plBlock = $('plBlock'), plEnergy = $('plEnergy');
const handArea = $('handArea'), mageWrap = $('mageWrap');
const pDraw = $('pileDraw'), pDiscard = $('pileDiscard');
const logEl = $('battleLog'), gameLayer = $('gameLayer');
const overlay = $('resultOverlay'), rTitle = $('resultTitle'), rDesc = $('resultDesc');

function log(txt, cls = '') {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.textContent = txt;
  logEl.appendChild(p);
  while (logEl.children.length > 5) logEl.removeChild(logEl.firstChild);
}

function render() {
  const pct = (ene.pv / ene.pvMax) * 100;
  enHpFill.style.width = pct + '%';
  enHpNum.textContent = `${ene.pv} / ${ene.pvMax}`;
  plHp.textContent = jug.pv;
  plBlock.textContent = jug.bloqueo;
  plEnergy.textContent = jug.energia;
  pDraw.textContent = jug.mazo.length;
  pDiscard.textContent = jug.descarte.length;
  enIntent.textContent = `ATACAR · ${ene.danio}`;
  renderMano();
}

function renderMano() {
  handArea.innerHTML = '';
  jug.mano.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card' + (c.sePuede(jug) && estado === 'turnoJugador' ? '' : ' disabled');
    el.innerHTML = `
      <div class="card-strip ${c.tipo}"></div>
      <div class="card-art"><img src="${c.arte}" alt="${c.nombre}"></div>
      <div class="card-cost">${c.coste}</div>
      <div class="card-name">${c.nombre}</div>
      <div class="card-desc">${c.desc}</div>
    `;
    if (c.sePuede(jug) && estado === 'turnoJugador') {
      el.addEventListener('click', () => jugarCarta(i));
    }
    handArea.appendChild(el);
  });
}

function screenShake() {
  gameLayer.classList.remove('shake');
  void gameLayer.offsetWidth;
  gameLayer.classList.add('shake');
}

function jugarCarta(i) {
  if (estado !== 'turnoJugador') return;
  const r = jug.jugar(i, ene);
  if (!r) return;
  const { carta, res } = r;

  // Mage attack animation
  mageWrap.classList.remove('attacking');
  void mageWrap.offsetWidth;
  mageWrap.classList.add('attacking');

  // Enemy hurt + screen shake for damage
  if (res.t === 'damage' || res.t === 'drain') {
    log(`⚡ ${carta.nombre}: ${res.v} de daño`, 'damage');
    enWrap.classList.remove('attacking');
    void enWrap.offsetWidth;
    enWrap.classList.add('attacking');
    screenShake();
  } else if (res.t === 'block') {
    log(`🛡️ ${carta.nombre}: +${res.v} Bloqueo`, 'block');
  } else if (res.t === 'buff') {
    log(`🌑 ${carta.nombre}: +${res.v} Fuerza`);
  }

  render();

  if (!ene.estaVivo()) {
    estado = 'victoria';
    log('🏆 ¡Victoria!', 'damage');
    setTimeout(() => { rTitle.className = 'victory'; rTitle.textContent = 'VICTORIA'; rDesc.textContent = 'El poder del relicario es tuyo.'; overlay.classList.add('show'); }, 600);
    return;
  }

  if (jug.energia <= 0) setTimeout(finTurno, 500);
}

function finTurno() {
  if (estado !== 'turnoJugador') return;
  estado = 'turnoEnemigo';
  jug.finTurno();
  log('⏭ Turno finalizado.');
  render();
  setTimeout(turnoEnemigo, 600);
}

function turnoEnemigo() {
  if (!ene.estaVivo()) return;

  // Enemy attack animation
  enWrap.classList.remove('attacking');
  void enWrap.offsetWidth;
  enWrap.classList.add('attacking');

  setTimeout(() => {
    const dmg = ene.actuar(jug);
    log(`💥 El Esqueleto Maldito ataca por ${dmg}!`, 'enemy-dmg');
    render();
    screenShake();

    if (!jug.estaVivo()) {
      estado = 'derrota';
      log('💀 Has caído...', 'enemy-dmg');
      setTimeout(() => { rTitle.className = 'defeat'; rTitle.textContent = 'DERROTA'; rDesc.textContent = 'Tu alma se pierde en la oscuridad...'; overlay.classList.add('show'); }, 600);
      return;
    }

    setTimeout(turnoJugador, 500);
  }, 350);
}

function turnoJugador() {
  if (estado === 'victoria' || estado === 'derrota') return;
  estado = 'turnoJugador';
  jug.iniTurno();
  log('🔮 Tu turno. (Robas 5 cartas)');
  render();
}

function iniciar() {
  overlay.classList.remove('show');
  logEl.innerHTML = '';
  jug = new Jugador(); jug.init();
  ene = new Enemigo();
  log('🌑 El templo maldito despierta...');
  log('💀 ¡El Esqueleto Maldito bloquea tu camino!', 'enemy-dmg');
  estado = 'turnoJugador';
  jug.robar(5);
  render();
}

$('endTurnBtn').addEventListener('click', finTurno);
$('restartBtn').addEventListener('click', iniciar);
iniciar();
</script>
</body>
</html>
